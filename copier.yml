_subdirectory: template

project_name:
  type: str
  help: What is your project name?

components:
  type: str
  multiselect: true
  help: Which components should be included?
  choices:
    - nix
    - python
    - agents

_exclude:
  - "{% if 'agents' not in components %}.agents/**{% endif %}"
  - "{% if 'python' not in components %}python/**{% endif %}"