_subdirectory: template
_min_copier_version: "9.0.0"
templates_suffix: ".jinja"

project_name:
  type: str
  help: What is your project name?

components:
  type: str
  multiselect: true
  default: ['git', 'nix', 'python', 'agents', 'docs', 'renovate']
  help: Which components should be included? (All enabled by default)
  choices:
    - git
    - nix
    - python
    - agents
    - docs
    - renovate

renovate_level:
  type: str
  help: Renovate update level
  choices:
    - minimal
    - patch
    - minor
    - yolo
  default: minimal

_tasks:
  - command: |
      if [ ! -d .git ]; then
        git init
      fi
    when: "{% if 'git' in components %}true{% endif %}"
    help: Initialize git repository if not already present
  - command: |
      echo "WARNING: The 'docs' component is selected without 'python'."
      echo "Great Docs requires Python to function properly."
      echo "It is strongly recommended to also enable the 'python' component."
      echo "The docs will be included as .qmd files, but Great Docs build will not work."
    when: "{% if 'docs' in components and 'python' not in components %}true{% endif %}"
    help: Warn about docs without python

_exclude:
  - "{% if 'git' not in components %}.gitattributes{% endif %}"
  - "{% if 'git' not in components %}.gitmessage{% endif %}"
  - "{% if 'agents' not in components %}AGENTS.md.jinja{% endif %}"
  - "{% if 'agents' not in components %}.agents/**{% endif %}"
  - "{% if 'nix' not in components %}flake.nix.jinja{% endif %}"
  - "{% if 'python' not in components %}src/**{% endif %}"
  - "{% if 'python' not in components %}pyproject.toml.jinja{% endif %}"
  - "{% if 'python' not in components %}.python-version{% endif %}"
  - "{% if 'python' not in components %}.github/workflows/tests.yml.jinja{% endif %}"
  - "{% if 'python' not in components %}.github/workflows/prek.yml.jinja{% endif %}"
  - "{% if 'docs' not in components %}docs/**{% endif %}"
  - "{% if 'docs' not in components %}docs/development/00_index.qmd.jinja{% endif %}"
  - "{% if 'docs' not in components %}great-docs.yml.jinja{% endif %}"
  - "{% if 'docs' not in components %}scripts/coverage_page.py.jinja{% endif %}"
  - "{% if 'renovate' not in components %}.github/renovate.json.jinja{% endif %}"
